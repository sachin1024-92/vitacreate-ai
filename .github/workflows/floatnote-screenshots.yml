name: FloatNote store screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build FOSS debug APK (no ads)
        run: ./gradlew --no-daemon assembleFossDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/capture-screenshots.sh

      - name: Commit screenshots to the floatnote-screenshots branch
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/out" && cp shots/*.png "$RUNNER_TEMP/out/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin floatnote-screenshots || true
          git checkout --orphan screenshots-tmp
          git rm -rfq . >/dev/null
          mkdir -p screenshots && cp "$RUNNER_TEMP/out/"*.png screenshots/
          printf 'Screenshots from commit %s (%s)\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > screenshots/SOURCE.txt
          git add screenshots
          git commit -qm "FloatNote screenshots from ${GITHUB_SHA::7}"
          git push -f origin HEAD:floatnote-screenshots
